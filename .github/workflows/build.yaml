name: Build
on:
  push:
    branches: [autobuild]
  pull_request:
    branches: [autobuild]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download Webview
        run: npx @neutralinojs/neu update

      - name: Build Executable
        run: npx @neutralinojs/neu build --embed-resources

      - name: Upload Windows
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}.exe
          path: dist/simple-wrapper/simple-wrapper-win_x64.exe
          archive: false

      - name: Upload Linux
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}
          path: dist/simple-wrapper/simple-wrapper-linux_x64
          archive: false

      - name: Upload Mac
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}_macos
          path: dist/simple-wrapper/simple-wrapper-mac_x64
          archive: false
